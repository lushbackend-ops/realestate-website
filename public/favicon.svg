<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Warm ivory background with subtle gold border -->
  <rect width="512" height="512" rx="100" fill="#FAF8F3" />
  <rect x="16" y="16" width="480" height="480" rx="84" stroke="#B08D57" stroke-width="6" opacity="0.4" />
  
  <!-- Crest: Hill & Purandar Fort Silhouette -->
  <g transform="translate(46, 70) scale(2.1)">
    <!-- Distant hills -->
    <path d="M 12 120 Q 50 70 100 86 Q 136 40 180 50 Q 200 80 200 120 Z" fill="#5B1F2A" opacity="0.15" />
    <path d="M 24 120 Q 64 64 110 74 Q 138 48 174 60 Q 196 90 200 120 Z" fill="#B08D57" opacity="0.3" />
    <!-- Fort Bastion Ramparts -->
    <path d="M 64 116 L 76 70 L 90 70 L 90 78 L 98 78 L 98 70 L 106 70 L 106 78 L 114 78 L 114 70 L 128 70 L 140 116 Z" fill="#5B1F2A" />
    <!-- Flag atop fort -->
    <line x1="102" y1="70" x2="102" y2="52" stroke="#B08D57" stroke-width="3" stroke-linecap="round" />
    <path d="M 102 52 L 120 58 L 102 64 Z" fill="#B08D57" />
    <!-- Foundation line -->
    <line x1="16" y1="120" x2="190" y2="120" stroke="#B08D57" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Monogram Initials PH -->
  <text x="256" y="420" font-family="'Instrument Serif', Georgia, serif" font-size="64" font-weight="700" fill="#5B1F2A" text-anchor="middle" letter-spacing="4">
    PURANDAR
  </text>
  <text x="256" y="456" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#B08D57" text-anchor="middle" letter-spacing="6">
    NEW PUNE
  </text>
</svg>
